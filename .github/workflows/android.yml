name: Android CI / CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK (signed with debug key if release key missing)'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Debug Key Signing)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Prepare Secrets Configuration (.env)
        run: |
          # The secrets-gradle-plugin requires .env (or .env.example) to be present
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
          # If a GEMINI_API_KEY secret is defined in GitHub repository secrets, inject it
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

      - name: Restore or Generate Debug Keystore
        id: setup_keystore
        run: |
          echo "=== Setting up debug keystore ==="
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "Generating new debug.keystore via keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Verifying debug.keystore..."
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey
          ls -la debug.keystore

      - name: Run Local JVM Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK (Signed with Debug Keystore)
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK Signature
        run: |
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found debug APK: $DEBUG_APK"
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f | sort -V | tail -n 1)
            if [ -x "$APKSIGNER" ]; then
              echo "Verifying with $APKSIGNER..."
              $APKSIGNER verify --verbose --print-certs "$DEBUG_APK"
            fi
          fi

      - name: Build & Sign Release APK (with Debug Key Fallback)
        if: github.event_name == 'push' || github.event.inputs.build_release == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "=== Building Release APK ==="
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.jks"
            export KEYSTORE_PATH="${{ github.workspace }}/release.jks"
            export STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "No custom release keystore provided. Using debug keystore to sign release APK..."
            export KEYSTORE_PATH="${{ github.workspace }}/debug.keystore"
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
            ./gradlew assembleRelease --no-daemon --stacktrace || true

            APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f | sort -V | tail -n 1)
            UNSIGNED_RELEASE_APK=$(find app/build/outputs/apk/release -name "*unsigned*.apk" 2>/dev/null | head -n 1)

            if [ -n "$UNSIGNED_RELEASE_APK" ] && [ -f "$UNSIGNED_RELEASE_APK" ]; then
              echo "Signing $UNSIGNED_RELEASE_APK with debug.keystore..."
              SIGNED_APK="${UNSIGNED_RELEASE_APK%-unsigned.apk}-signed-debug.apk"
              $APKSIGNER sign --ks debug.keystore \
                --ks-pass pass:android \
                --ks-key-alias androiddebugkey \
                --key-pass pass:android \
                --out "$SIGNED_APK" \
                "$UNSIGNED_RELEASE_APK"
              echo "Signed release APK created at: $SIGNED_APK"
              $APKSIGNER verify --verbose "$SIGNED_APK"
            fi
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Unit Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
